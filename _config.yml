title: "DART"
description: "DART – Intelligent Detection, Response and Analysis of Security Events. A TETRA project helping Flemish SMEs and non-profits build feasible, NIS2-aligned detection and incident response capabilities."
lang: en
baseurl: ""
url: "https://dart.projects.cybersecurity-research.be"

# Build settings
plugins:
  - jekyll-feed
  - jekyll-seo-tag

# Navigation
header_pages:
  - index.md
  - project.md
  - knowledge-dissemination.md
  - consortium.md

# Project information
project:
  acronym: "DART"
  full_name: "Intelligent Detection, Response and Analysis of Security Events"
  start_date: "TBD"   # TODO: fill in official start date
  duration: "24 months"
  type: "TETRA Project (VLAIO – Cybersecurity programme)"
  lead: "KU Leuven - DistriNet Campus Gent"

# Exclude from processing
exclude:
  - README.md
  - CONTRIBUTING.md
  - DESIGN_IMPROVEMENTS.md
  - DESIGN_SUMMARY.md
  - FOOTER_LOGOS.md
  - IMAGES_GUIDE.md
  - QUICKSTART_DESIGN.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - mcp-server

# Collections
collections:
  dissemination:
    output: true
    permalink: /knowledge-dissemination/:name/
  articles:
    output: true
    permalink: /knowledge-dissemination/articles/:name/
  blog:
    output: true
    permalink: /blog/:name/
